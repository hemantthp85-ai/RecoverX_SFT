name: recoverx
description: "RecoverX — Smart Wearable Recovery & Rehabilitation System"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # HTTP client
  http: ^1.2.2

  # State management
  provider: ^6.1.2

  # Local storage (for auth tokens, settings)
  shared_preferences: ^2.3.3

  # Google Fonts
  google_fonts: ^6.2.1

  # Equatable for value equality
  equatable: ^2.0.5

  # Bluetooth Low Energy (BLE) for ESP32 Wearable
  flutter_blue_plus: ^1.34.0

  # Permission Handler for Android BLE runtime permissions
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
